
name: postgresql-performance-lab

services:
  postgres:
    image: postgres:17.12-bookworm
    environment:
      POSTGRES_DB: performance_lab
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5476:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d performance_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
